<mat-drawer-container class="example-container">
  <!-- Sidebar -->
  <mat-drawer #sidenav mode="side" [opened]="true" class="side-nav" [class.collapsed]="isCollapsed">
    <mat-nav-list>
      <!-- Sidebar Header with Logo & Toggle Button -->
      <div class="sidenav-header">
        <button mat-button routerLink="/dashboard" class="nav-button" (click)="setActive('dashboard')">
          <mat-icon class="nav-icon">dashboard</mat-icon>
          <span class="mat-list-title-text" *ngIf="!isCollapsed">Dashboard</span>
        </button>
        <!-- Sidebar Toggle Button -->
        <button mat-icon-button (click)="toggleSidenav()" class="toggle-btn">
          <mat-icon>{{ isCollapsed ? 'menu_open' : 'menu_open' }}</mat-icon>
        </button>
      </div>

      <!-- Separator -->
      <div class="border-end"></div>

      <!-- Loop through sections dynamically -->
      <mat-expansion-panel *ngFor="let section of sidebarData.sections" [expanded]="!isCollapsed" class="small-panel">
        <mat-expansion-panel-header>
          <mat-panel-title>
            <mat-icon class="nav-icon material-symbols-outlined">{{ section.icon }}</mat-icon>
            <span *ngIf="!isCollapsed" class="mat-list-title-text">{{ section.title }}</span>
          </mat-panel-title>
        </mat-expansion-panel-header>

        <!-- Loop through items of each section dynamically -->
        <mat-list>
          <mat-list-item *ngFor="let item of section.items" (click)="navigateTo(item.route)"
            [class.active]="activeItem === item.label">
            <div class="nav-list-text">
              <mat-icon class="nav-icon material-symbols-outlined">{{ item.icon }}</mat-icon>
              <span *ngIf="!isCollapsed" class="mat-list-text">{{ item.label }}</span>
            </div>
          </mat-list-item>
        </mat-list>
      </mat-expansion-panel>

      <div class="border-end"></div>
    </mat-nav-list>
  </mat-drawer>

  <!-- Main Content -->
  <mat-drawer-content class="content-container" [class.shrink]="isCollapsed">
    <router-outlet></router-outlet>
  </mat-drawer-content>
</mat-drawer-container>
