<div class="user-role-main-container">
  <div>
    <span class="heading-container">User & Role</span>
  </div>

  <!-- Tab Row -->
  <div class="tab-row">
    <mat-tab-group [(selectedIndex)]="selectedTabIndex" (selectedIndexChange)="onTabChange($event)">
      <mat-tab label="User" routerLink="user"></mat-tab>
      <mat-tab label="Role" routerLink="role"></mat-tab>
      <mat-tab label="Permission" routerLink="permission"></mat-tab>
    </mat-tab-group>

    <!-- Search Bar in the Center -->
    <div class="search-container">
      <i class="fas fa-search search-icon"> </i>
      <input type="text" placeholder="Search..." class="search-input" />
    </div>

    <!-- Conditionally render Add button based on selected tab -->
    <ng-container *ngIf="selectedTabIndex === 0"> <!-- User Tab -->
      <button mat-stroked-button color="primary">
        <mat-icon>add</mat-icon> Add User
      </button>
    </ng-container>

    <ng-container *ngIf="selectedTabIndex === 1"> <!-- Role Tab -->
      <button mat-stroked-button color="primary">
        <mat-icon>add</mat-icon> Add Role
      </button>
    </ng-container>

    <!-- No button for Permission Tab -->
    <ng-container *ngIf="selectedTabIndex === 2"> <!-- Permission Tab -->
      <!-- No button shown here -->
    </ng-container>
  </div>

  <router-outlet></router-outlet>
</div>
